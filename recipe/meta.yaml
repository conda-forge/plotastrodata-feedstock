{% set python_min = "3.11" %}
{% set name = "plotastrodata" %}
{% set version = "1.10.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/plotastrodata-{{ version }}.tar.gz
  sha256: bb339c51948c189edc905f353aa6cf2be62b1e6a6e974cc224d4cf37d7df05a8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - astropy-base >=7.2
    - corner
    - dynesty
    - emcee >=3.1.5
    - matplotlib-base
    - numpy >=2.0
    - pillow
    - plotly
    - ptemcee
    - pydantic >=2
    - scikit-image
    - scipy
    - tqdm

test:
  imports:
    - plotastrodata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/yusukeaso-astron/plotastrodata
  doc_url: https://plotastrodata.readthedocs.io
  summary: plotastrodata is a tool for astronomers to create figures from FITS files and perform fundamental data analyses with ease.
  license: GPL-2.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yusukeaso-astron
