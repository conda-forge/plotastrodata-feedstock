schema_version: 1

context:
  python_min: "3.11"
  name: plotastrodata
  version: "1.12.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/plotastrodata-${{ version }}.tar.gz
  sha256: 709ee12dbb620524b1eb07fb363302948ff71ee518c94169c35650dab306336c

build:
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astropy-base >=7.2
    - corner
    - dynesty
    - emcee >=3.1.5
    - matplotlib-base
    - numpy >=2.0
    - pillow
    - plotly
    - ptemcee
    - pydantic >=2
    - scikit-image
    - scipy
    - tqdm

tests:
  - python:
      imports:
        - plotastrodata
        - plotastrodata.plot_utils
        - plotastrodata.analysis_utils
        - plotastrodata.fits_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yusukeaso-astron/plotastrodata
  documentation: https://plotastrodata.readthedocs.io
  summary: plotastrodata is a tool for astronomers to create figures from FITS files and perform fundamental data analyses with ease.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yusukeaso-astron
